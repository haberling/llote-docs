<!--
  llote docs shell -- deliberately NOT the Canary default header/nav/footer
  layout. There is no site-nav menu: the notebook's own page-flip IS the
  navigation. #app still receives each route's real prerendered content
  (required for crawlers/no-JS/social previews) but is hidden once
  js/notebook.js has rehomed it into the flip deck. See root-copy/js/
  notebook.js for how navigation is actually handled (it overrides the
  default hybrid-router content-swap via registerRouteHandler).
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  {{favicon}}
  <meta name="theme-color" content="#ff6600">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="/css/framework.css">
  <link rel="stylesheet" href="/css/theme.css">
  {{widgetStyles}}
</head>
<body>
  <div class="desk">
    <div class="notebook" id="notebook" role="region" aria-label="llote docs notebook">
      <div class="spiral" aria-hidden="true"></div>
      <main id="app">{{content}}</main>

      <nav class="notebook-controls" aria-label="Notebook pages">
        <a id="nb-menu" class="notebook-nav-btn" href="/contents/" aria-label="Table of contents">&#9776;</a>
        <a id="nb-prev" class="notebook-nav-btn" href="/" aria-label="Previous page">&#8592;</a>
        <div id="nb-indicator" class="notebook-indicator" aria-live="polite"></div>
        <a id="nb-next" class="notebook-nav-btn" href="/" aria-label="Next page">&#8594;</a>
      </nav>
    </div>
  </div>

  <footer class="site-footer">
    <span>llote docs &mdash; built with Canary.</span>
  </footer>

  <script type="module" src="/js/notebook.js"></script>
  {{widgetScripts}}
</body>
</html>
