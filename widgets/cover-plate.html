<!--
  Cover-only stamp: version, edition, platform, and publisher, in the
  register of a mid-90s boxed-software user's guide. Filled from the
  fence block's YAML. See cover-plate.css; theme.css tints it for the
  orange cover board and pins the publisher to the bottom edge.
-->
<!--clipboard
```cover-plate
version: "1.0.0.0"
edition: "User's Guide"
platform: "for Windows"
publisher: "Habersoft"
year: "2026"
```
-->
<div class="cover-plate-widget" data-widget="cover-plate">
  <p class="cover-plate-version">Version {{version}}</p>
  <p class="cover-plate-edition">{{edition}}</p>
  <p class="cover-plate-platform">{{platform}}</p>
  <p class="cover-plate-publisher">{{publisher}}</p>
  <p class="cover-plate-copy">&#169; {{year}}</p>
</div>
